<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC Call Audio Fix</title>
</head>
<body>
  <button id="startCallBtn">Start Call Audio</button>
  <button id="endCallBtn" disabled>End Call</button>
  <label>
    Remote Volume:
    <input id="volumeSlider" type="range" min="0" max="1.5" step="0.05" value="1" />
  </label>
  <audio id="remoteAudioEl" autoplay playsinline></audio>

  <script>
    let audioCtx = null;
    let localStream = null;
    let processedLocalStream = null;
    let remoteGainNode = null;

    /**
     * Safely validates that a node has at least 1 output before connecting.
     */
    function safeConnect(sourceNode, destinationNode) {
      if (!sourceNode || typeof sourceNode.connect !== 'function') {
        throw new Error('Invalid source AudioNode.');
      }
      if (sourceNode.numberOfOutputs === 0) {
        throw new Error(
          `Cannot call .connect() on ${sourceNode.constructor.name}: it has 0 outputs (it is an endpoint/destination).`
        );
      }
      sourceNode.connect(destinationNode);
    }

    /**
     * Sets up local microphone processing (e.g., mic gain / level meter)
     * and returns a clean MediaStream to attach to RTCPeerConnection.
     */
    async function setupLocalAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      localStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });

      // 1. Mic input -> MediaStreamAudioSourceNode (has 1 output)
      const micSource = audioCtx.createMediaStreamSource(localStream);

      // 2. Optional mic gain node (has 1 input, 1 output)
      const micGain = audioCtx.createGain();
      micGain.gain.value = 1.0;

      // 3. Destination stream to send over WebRTC (has 1 input, 0 outputs)
      const rtcDestination = audioCtx.createMediaStreamDestination();

      // Connect forward: micSource -> micGain -> rtcDestination
      safeConnect(micSource, micGain);
      safeConnect(micGain, rtcDestination);

      processedLocalStream = rtcDestination.stream;
      return processedLocalStream;
    }

    /**
     * Routes incoming remote peer stream to speakers with volume control.
     * Call this inside peerConnection.ontrack = (event) => { ... }
     */
    async function setupRemoteAudio(remoteStream) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      // Attach to hidden <audio> element as well (helps Chromium/mobile WebRTC audio routing)
      const remoteAudioEl = document.getElementById('remoteAudioEl');
      remoteAudioEl.srcObject = remoteStream;
      remoteAudioEl.muted = true; // Muted so Web Audio handles playback without double-audio

      // 1. Remote stream -> MediaStreamAudioSourceNode (has 1 output)
      const remoteSource = audioCtx.createMediaStreamSource(remoteStream);

      // 2. Volume control node (has 1 input, 1 output)
      remoteGainNode = audioCtx.createGain();
      remoteGainNode.gain.value = parseFloat(document.getElementById('volumeSlider').value);

      // 3. Final speaker output: audioCtx.destination (has 1 input, 0 outputs)
      // NEVER call audioCtx.destination.connect(...)
      safeConnect(remoteSource, remoteGainNode);
      safeConnect(remoteGainNode, audioCtx.destination);
    }

    /**
     * Cleanly tears down streams and AudioContext when call ends.
     */
    async function cleanupCallAudio() {
      if (localStream) {
        localStream.getTracks().forEach((track) => track.stop());
        localStream = null;
      }
      if (processedLocalStream) {
        processedLocalStream.getTracks().forEach((track) => track.stop());
        processedLocalStream = null;
      }
      remoteGainNode = null;

      if (audioCtx && audioCtx.state !== 'closed') {
        await audioCtx.close();
        audioCtx = null;
      }
    }

    // --- UI Wiring ---
    document.getElementById('volumeSlider').addEventListener('input', (e) => {
      if (remoteGainNode && audioCtx) {
        remoteGainNode.gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
      }
    });

    document.getElementById('startCallBtn').addEventListener('click', async () => {
      try {
        const outboundStream = await setupLocalAudio();
        console.log('Outbound WebRTC audio ready:', outboundStream);

        // Example: add tracks to your RTCPeerConnection
        // outboundStream.getTracks().forEach(track => pc.addTrack(track, outboundStream));

        // Example: when remote track arrives on pc.ontrack:
        // pc.ontrack = (event) => setupRemoteAudio(event.streams[0]);

        document.getElementById('startCallBtn').disabled = true;
        document.getElementById('endCallBtn').disabled = false;
      } catch (err) {
        console.error('Could not start call:', err);
        alert('Could not start call: ' + err.message);
      }
    });

    document.getElementById('endCallBtn').addEventListener('click', async () => {
      await cleanupCallAudio();
      document.getElementById('startCallBtn').disabled = false;
      document.getElementById('endCallBtn').disabled = true;
    });
  </script>
</body>
</html>
